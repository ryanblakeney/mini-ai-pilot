# Keep the whole build comfortably inside the systemd memory cap used on sable:
# systemd-run --user --scope --quiet --collect -p MemoryHigh=4G -p MemoryMax=5G -p CPUWeight=50 nice -n 10 gradle --no-daemon <task>
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
kotlin.stdlib.default.dependency=true
